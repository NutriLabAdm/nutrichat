<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NutriChat{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-primary text-white text-center py-3">
        <div class="d-flex justify-content-between align-items-center container">
            <img src="/static/logo_face.svg" alt="NutriChat Logo" height="50">
            <h1 class="m-0">NutriChat</h1>
            {% if request.user.is_authenticated %}
            <div class="dropdown">
                <button class="btn btn-light dropdown-toggle" type="button" id="profileMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    {{ request.user.name }}
                </button>
                <ul class="dropdown-menu" aria-labelledby="profileMenu">
                    <li><a class="dropdown-item" href="/profile">Профиль</a></li>
                    <li><a class="dropdown-item" href="/logout">Выйти</a></li>
                </ul>
            </div>
            {% else %}
            <a href="/auth/google" class="btn btn-light">Войти</a>
            {% endif %}
        </div>
    </header>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p>&copy; 2025 NutriChat. All rights reserved.</p>
    </footer>
</body>
</html>
